name: Publicar imagen Docker

# Publica en GitHub Container Registry (ghcr.io/consultores-odoo-colombia/odoo20-ce, paquete publico).
# El paquete hereda la visibilidad que se le configure en GitHub Packages.
on:
  push:
    branches: ["20.0-coolify"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/consultores-odoo-colombia/odoo20-ce
          tags: |
            type=raw,value=20.0,enable=${{ github.ref == 'refs/heads/20.0-coolify' }}
            type=ref,event=tag
            type=sha,format=short,prefix=20.0-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
